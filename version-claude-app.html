<style>
/* Layout: one-column phone app — sticky title bar, stacked sections, fixed bottom tab bar; cards only for things you act on */
:root{
  --bg:#F4F7F3; --surface:#FFFFFF; --surface-2:#EAF0E9; --ink:#1B2620; --muted:#5F6F65; --line:#DAE3DA;
  --accent:#2C8A5F; --accent-ink:#FFFFFF; --accent-soft:#DCEFE3;
  --prot:#D2654C; --carb:#C98F22; --fat:#3F7DC4; --warn:#B9542C; --warn-soft:#F8E6DD;
  --font-display:"Bricolage Grotesque", ui-rounded, -apple-system, system-ui, sans-serif;
  --font-body:"Figtree", -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
  --r:16px; --shadow:0 1px 2px rgba(27,38,32,.06),0 4px 14px rgba(27,38,32,.05);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#111613; --surface:#19201B; --surface-2:#222B25; --ink:#E6EEE8; --muted:#98A79D; --line:#2B362F;
  --accent:#5DBE8D; --accent-ink:#0D1A12; --accent-soft:#1E3829;
  --prot:#EC8A72; --carb:#E3B456; --fat:#79A9E5; --warn:#EC8E66; --warn-soft:#3A2419;
  --shadow:0 1px 2px rgba(0,0,0,.3); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#111613; --surface:#19201B; --surface-2:#222B25; --ink:#E6EEE8; --muted:#98A79D; --line:#2B362F;
  --accent:#5DBE8D; --accent-ink:#0D1A12; --accent-soft:#1E3829;
  --prot:#EC8A72; --carb:#E3B456; --fat:#79A9E5; --warn:#EC8E66; --warn-soft:#3A2419;
  --shadow:0 1px 2px rgba(0,0,0,.3); color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:16px;line-height:1.45;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{font-family:var(--font-display);font-weight:700;margin:0;text-wrap:balance;letter-spacing:-.01em}
.num{font-variant-numeric:tabular-nums}
.app{max-width:560px;margin:0 auto;padding-inline:16px;padding-bottom:calc(96px + env(safe-area-inset-bottom,0px))}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:14px 10px}
.top h1{font-size:1.75rem}
.top .sub{color:var(--muted);font-size:.85rem;margin-top:2px}
.icon-btn{width:40px;height:40px;border-radius:12px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;cursor:pointer;flex:none}
.icon-btn svg{width:20px;height:20px}
.view{display:flex;flex-direction:column;gap:22px;padding-top:4px}
.section{display:flex;flex-direction:column;gap:10px}
.section-h{display:flex;align-items:baseline;justify-content:space-between;gap:8px}
.section-h h2{font-size:1.15rem}
.eyebrow{font-size:.72rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600}
.link{background:none;border:0;color:var(--accent);font-weight:600;cursor:pointer;padding:4px 0}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;box-shadow:var(--shadow)}
.muted{color:var(--muted)}
.small{font-size:.85rem}
.row{display:flex;align-items:center;gap:10px}
.grow{flex:1;min-width:0}
.btn{border:0;border-radius:12px;padding:12px 16px;font-weight:600;cursor:pointer;background:var(--accent);color:var(--accent-ink);display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn.ghost{background:var(--surface-2);color:var(--ink)}
.btn.warn{background:var(--warn-soft);color:var(--warn)}
.btn.block{width:100%}
.btn:disabled{opacity:.5;cursor:default}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* tabs */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:10;background:var(--surface);border-top:1px solid var(--line);padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px))}
.tabs-in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
.tab{background:none;border:0;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 0;color:var(--muted);font-size:.7rem;font-weight:600;cursor:pointer}
.tab svg{width:24px;height:24px}
.tab[aria-current="page"]{color:var(--accent)}

/* banner */
.banner{background:var(--accent-soft);border-radius:var(--r);padding:12px 14px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.banner p{margin:0;flex:1;min-width:180px;font-size:.9rem}
.banner.warn{background:var(--warn-soft)}

/* rings & bars */
.today-sum{display:grid;grid-template-columns:auto 1fr;gap:18px;align-items:center}
.ring{width:118px;height:118px;position:relative}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .center{position:absolute;inset:0;display:grid;place-items:center;text-align:center}
.ring .big{font-family:var(--font-display);font-size:1.55rem;font-weight:700;line-height:1}
.bars{display:flex;flex-direction:column;gap:10px;min-width:0}
.bar-l{display:flex;justify-content:space-between;font-size:.82rem;margin-bottom:4px;gap:6px}
.bar{height:8px;border-radius:99px;background:var(--surface-2);overflow:hidden}
.bar i{display:block;height:100%;border-radius:99px}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block;margin-right:6px;vertical-align:middle}

/* meal slots */
.slots{display:flex;flex-direction:column}
.slot{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.slot:last-child{border-bottom:0}
.slot .lbl{width:78px;flex:none;font-size:.78rem;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.05em}
.slot .name{font-weight:600;cursor:pointer;background:none;border:0;padding:0;text-align:left}
.check{width:30px;height:30px;border-radius:50%;border:2px solid var(--line);background:none;display:grid;place-items:center;cursor:pointer;flex:none}
.check svg{width:16px;height:16px;opacity:0}
.check.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.check.on svg{opacity:1}
.add-slot{background:none;border:1px dashed var(--line);border-radius:10px;padding:8px 12px;color:var(--muted);cursor:pointer;font-weight:600;font-size:.88rem}

/* chips */
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:7px 12px;font-size:.88rem;cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.chip.on{background:var(--accent-soft);border-color:var(--accent);color:var(--ink);font-weight:600}
.chip.on::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--accent)}
.tag{font-size:.75rem;border-radius:6px;padding:2px 7px;background:var(--surface-2);color:var(--muted);font-weight:600;white-space:nowrap}
.tag.ok{background:var(--accent-soft);color:var(--accent)}
.tag.warn{background:var(--warn-soft);color:var(--warn)}
.seg{display:flex;background:var(--surface-2);border-radius:12px;padding:3px;gap:2px;overflow-x:auto}
.seg button{flex:1;border:0;background:none;padding:8px 10px;border-radius:9px;font-weight:600;font-size:.85rem;color:var(--muted);cursor:pointer;white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}

/* recipe list */
.rlist{display:flex;flex-direction:column;gap:10px}
.rcard{display:grid;grid-template-columns:44px 1fr;gap:12px;align-items:start;text-align:left;width:100%;cursor:pointer}
.rbadge{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;font-family:var(--font-display);font-weight:700;font-size:1.1rem}
.rbadge.desayuno{background:#F6E7C8;color:#8A5F0C}.rbadge.comida{background:#DCEFE3;color:#1F6B47}
.rbadge.cena{background:#DCE7F5;color:#2B5C93}.rbadge.snack{background:#F6DDD6;color:#9A3F2A}
:root[data-theme="dark"] .rbadge{filter:saturate(.8) brightness(.8)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .rbadge{filter:saturate(.8) brightness(.8)}}
.rcard h3{font-size:1rem;font-family:var(--font-body);font-weight:700;letter-spacing:0}
.rmeta{display:flex;flex-wrap:wrap;gap:6px 10px;font-size:.8rem;color:var(--muted);margin-top:4px}
.rmeta b{color:var(--ink);font-weight:600}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}

/* inputs */
.field{display:flex;flex-direction:column;gap:5px}
.field label{font-size:.8rem;color:var(--muted);font-weight:600}
.input,select.input{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:11px;padding:11px 12px;font-size:16px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}

/* stats */
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.stat .v{font-family:var(--font-display);font-size:1.35rem;font-weight:700;line-height:1.1}
.stat .k{font-size:.75rem;color:var(--muted);margin-top:3px}

/* week */
.week-nav{display:flex;align-items:center;justify-content:space-between;gap:8px}
.day{padding:12px 14px}
.day-h{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin-bottom:6px}
.day-h b{font-family:var(--font-display);font-size:1.02rem}
.day.today{border-color:var(--accent)}
.mini-slot{display:flex;gap:10px;align-items:center;padding:6px 0;font-size:.9rem;cursor:pointer;background:none;border:0;width:100%;text-align:left}
.mini-slot .lbl{width:74px;flex:none;color:var(--muted);font-size:.75rem;text-transform:uppercase;letter-spacing:.05em;font-weight:600}
.mini-slot .empty{color:var(--muted)}

/* chart */
.chart svg{width:100%;height:auto;display:block}
.chart text{fill:var(--muted);font-size:10px;font-family:var(--font-body)}

/* sheet */
.sheet{position:fixed;inset:0;z-index:30}
.sheet-bg{position:absolute;inset:0;background:rgba(10,20,14,.38)}
.sheet-panel{position:absolute;left:0;right:0;bottom:0;max-height:92%;overflow-y:auto;background:var(--bg);border-radius:22px 22px 0 0;padding:8px 16px calc(24px + env(safe-area-inset-bottom,0px));max-width:600px;margin:0 auto;animation:up .22s ease-out}
@keyframes up{from{transform:translateY(30px);opacity:.6}}
@media (prefers-reduced-motion: reduce){.sheet-panel{animation:none}}
.grab{width:40px;height:5px;border-radius:9px;background:var(--line);margin:4px auto 10px}
.sheet-h{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:14px}
.sheet-h h2{font-size:1.45rem}
.sheet-body{display:flex;flex-direction:column;gap:18px}
.ilist{list-style:none;margin:0;padding:0}
.ilist li{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--line);font-size:.95rem}
.ilist li:last-child{border-bottom:0}
.have{width:20px;height:20px;border-radius:6px;display:grid;place-items:center;flex:none;font-size:.7rem;font-weight:700}
.have.y{background:var(--accent-soft);color:var(--accent)}
.have.n{background:var(--warn-soft);color:var(--warn)}
.steps{margin:0;padding-left:1.3em;display:flex;flex-direction:column;gap:8px}
.steps li{padding-left:4px}
.stepper{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:11px;overflow:hidden}
.stepper button{border:0;background:var(--surface-2);width:36px;height:36px;font-size:1.1rem;cursor:pointer}
.stepper span{min-width:44px;text-align:center;font-weight:600}
.macro-row{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;text-align:center}
.macro-row div{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:8px 4px}
.macro-row b{display:block;font-family:var(--font-display);font-size:1.15rem}
.macro-row span{font-size:.72rem;color:var(--muted)}
.toast{position:fixed;left:50%;bottom:calc(92px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:.9rem;font-weight:600;z-index:50;max-width:calc(100% - 32px);text-align:center}
.empty-note{padding:18px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:var(--r);font-size:.92rem}
.sync{font-size:.72rem;color:var(--muted)}
textarea.input{min-height:90px;resize:vertical}
@media (max-width:380px){.grid4{grid-template-columns:repeat(2,1fr)}.today-sum{grid-template-columns:1fr;justify-items:center}.bars{width:100%}}
</style>

/* ---------- Utilidades ---------- */
const $ = s=>document.querySelector(s);
const esc = s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const pad = n=>String(n).padStart(2,"0");
const iso = d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const parse = s=>{const [y,m,d]=s.split("-").map(Number);return new Date(y,m-1,d)};
const addDays = (s,n)=>{const d=parse(s);d.setDate(d.getDate()+n);return iso(d)};
const todayISO = ()=>iso(new Date());
const monday = s=>{const d=parse(s);const wd=(d.getDay()+6)%7;d.setDate(d.getDate()-wd);return iso(d)};
const DOW = ["domingo","lunes","martes","miércoles","jueves","viernes","sábado"];
const MON = ["ene","feb","mar","abr","may","jun","jul","ago","sep","oct","nov","dic"];
const fmtDay = s=>{const d=parse(s);return `${DOW[d.getDay()]} ${d.getDate()} ${MON[d.getMonth()]}`};
const cap = s=>s.charAt(0).toUpperCase()+s.slice(1);
const r0 = n=>Math.round(n);
const r1 = n=>Math.round(n*10)/10;
const money = n=>`${(Math.round(n*100)/100).toFixed(2).replace(".",",")} ${state.settings.currency}`;
const kg = n=>`${r1(n).toString().replace(".",",")} kg`;
const allRecipes = ()=>RECIPES.concat(state.custom||[]);
const recipe = id=>allRecipes().find(r=>r.id===id);
const ingName = id=>(ING[id]||state.customIng?.[id]||[id])[0];
function ingData(id){return ING[id]||state.customIng?.[id]||[id,0,0,0,0,0,"Despensa"]}

function macros(r,serv=1){
  if(r.macros) return {kcal:r.macros.kcal*serv,p:r.macros.p*serv,c:r.macros.c*serv,f:r.macros.f*serv,cost:(r.cost||0)*serv};
  let m={kcal:0,p:0,c:0,f:0,cost:0};
  for(const [id,g] of r.ing){const d=ingData(id);const k=g*serv/100;m.kcal+=d[1]*k;m.p+=d[2]*k;m.c+=d[3]*k;m.f+=d[4]*k;m.cost+=d[5]*g*serv/1000}
  return m;
}
function coverage(r){
  const ids=r.ing.map(x=>x[0]); const have=ids.filter(id=>state.pantry.includes(id));
  const missing=r.ing.filter(x=>!state.pantry.includes(x[0]));
  const missCost=missing.reduce((s,[id,g])=>s+ingData(id)[5]*g/1000,0);
  return {have:have.length,total:ids.length,missing,missCost};
}
function qty(id,g){const u=ingData(id)[7];if(u){const n=g/u[1];if(Math.abs(n-Math.round(n*2)/2)<0.08)return `${String(Math.round(n*2)/2).replace(".",",")} ${u[0]}`} return `${r0(g)} g`}

/* ---------- Objetivos (Mifflin-St Jeor) ---------- */
function currentWeight(){const w=state.weights;return w.length?w[w.length-1].w:state.profile.startWeight}
function targets(){
  const p=state.profile, w=currentWeight();
  const bmr=10*w+6.25*p.height-5*p.age+(p.sex==="m"?-161:5);
  const tdee=bmr*p.activity;
  const dir=p.goalWeight<w-0.3?-1:p.goalWeight>w+0.3?1:0;
  let kcal=tdee+(dir<0?-p.rate*7700/7:dir>0?p.rate*7700/7*0.6:0);
  kcal=Math.max(kcal,p.sex==="m"?1200:1500,bmr*0.95);
  const pr=w*(dir<0?2.0:1.8), fat=w*0.8, carb=Math.max(0,(kcal-pr*4-fat*9)/4);
  return {kcal:r0(kcal),p:r0(pr),c:r0(carb),f:r0(fat),tdee:r0(tdee),bmr:r0(bmr),dir};
}
function eatenOn(d){
  let m={kcal:0,p:0,c:0,f:0};
  const plan=state.plan[d]||{}, eat=state.eaten[d]||{};
  for(const [s] of SLOTS){if(plan[s]&&eat[s]){const r=recipe(plan[s]);if(r){const x=macros(r);m.kcal+=x.kcal;m.p+=x.p;m.c+=x.c;m.f+=x.f}}}
  for(const e of state.extras[d]||[]){m.kcal+=+e.kcal||0;m.p+=+e.p||0;m.c+=+e.c||0;m.f+=+e.f||0}
  return m;
}
function weekSpend(d){const m=monday(d),e=addDays(m,6);return state.spend.filter(x=>x.d>=m&&x.d<=e).reduce((s,x)=>s+x.a,0)}

function load(){try{const j=localStorage.getItem(LS);if(j)return normalize(JSON.parse(j))}catch(e){}return exampleState()}
function normalize(s){const b=emptyState();for(const k in b){if(s[k]===undefined)s[k]=b[k]}s.profile={...b.profile,...s.profile};s.settings={...b.settings,...s.settings};return s}
let state=load();
let docRef=null, writing=false, again=false, timer=null, syncState="local";
function save(){
  try{localStorage.setItem(LS,JSON.stringify(state))}catch(e){}
  if(docRef){clearTimeout(timer);timer=setTimeout(flush,700)}
}
async function flush(){
  if(!docRef)return; if(writing){again=true;return}
  writing=true;
  try{await docRef.set({json:JSON.stringify(state),savedAt:new Date().toISOString()});syncState="ok"}
  catch(e){syncState="error"}
  writing=false; updateSync();
  if(again){again=false;flush()}
}
async function connect(){
  if(!window.claude||!window.claude.use)return;
  try{
    const [db,user]=await Promise.all([claude.use("db"),claude.use("user")]);
    if(!db||!user)return;
    const id=await user.id(); if(!id)return;
    docRef=db.doc(`data/users/${id}/state`);
    const snap=await docRef.get();
    if(snap.exists){const d=snap.data();if(d&&d.json){state=normalize(JSON.parse(d.json));try{localStorage.setItem(LS,JSON.stringify(state))}catch(e){}}syncState="ok";render()}
    else{await flush()}
    updateSync();
  }catch(e){syncState="error";updateSync()}
}
function updateSync(){const el=document.getElementById("syncNote");if(el)el.textContent=syncLabel()}
function syncLabel(){return syncState==="ok"?"Guardado en tu cuenta":syncState==="error"?"No se pudo guardar en la nube; se guarda en este dispositivo":"Guardado en este dispositivo"}

function badge(r){return `<div class="rbadge ${r.meal}">${esc(r.name.charAt(0))}</div>`}
function bar(label,val,max,color,unit="g"){
  const pct=max?Math.min(100,val/max*100):0;
  return `<div><div class="bar-l"><span><span class="dot" style="background:${color}"></span>${label}</span><span class="num muted">${r0(val)} / ${r0(max)} ${unit}</span></div><div class="bar"><i style="width:${pct}%;background:${color}"></i></div></div>`;
}
function ring(val,max){
  const R=50,C=2*Math.PI*R,p=Math.min(1,max?val/max:0);
  const over=val>max*1.05;
  return `<div class="ring"><svg viewBox="0 0 120 120"><circle cx="60" cy="60" r="${R}" fill="none" stroke="var(--surface-2)" stroke-width="11"/><circle cx="60" cy="60" r="${R}" fill="none" stroke="${over?"var(--warn)":"var(--accent)"}" stroke-width="11" stroke-linecap="round" stroke-dasharray="${C*p} ${C}"/></svg><div class="center"><div><div class="big num">${r0(Math.max(0,max-val))}</div><div class="small muted">kcal restantes</div></div></div></div>`;
}
function recipeCard(r,extra=""){
  const m=macros(r),cv=coverage(r);
  return `<button class="card rcard" data-recipe="${r.id}">${badge(r)}<div class="grow"><h3>${esc(r.name)}</h3>
  <div class="rmeta num"><span><b>${r0(m.kcal)}</b> kcal</span><span><b>${r0(m.p)}</b> g prot</span><span>${r.time} min</span><span>${money(m.cost)}</span></div>
  <div class="tags">${cv.missing.length===0?'<span class="tag ok">Lo tienes todo</span>':`<span class="tag">${cv.have}/${cv.total} ingredientes</span>`}${extra}</div></div></button>`;
}

function weightChart(){
  const w=state.weights; if(w.length<2) return `<div class="empty-note">Registra al menos dos pesos para ver tu evolución.</div>`;
  const W=340,H=170,L=34,R=10,T=12,B=24;
  const gw=state.profile.goalWeight;
  const vals=w.map(x=>x.w).concat([gw]); let mn=Math.floor(Math.min(...vals)-0.5), mx=Math.ceil(Math.max(...vals)+0.5);
  const t0=parse(w[0].d).getTime(), t1=Math.max(parse(w[w.length-1].d).getTime(),t0+864e5);
  const x=d=>L+(parse(d).getTime()-t0)/(t1-t0)*(W-L-R), y=v=>T+(mx-v)/(mx-mn)*(H-T-B);
  const step=Math.max(1,Math.ceil((mx-mn)/4));
  let grid="";for(let v=mn;v<=mx;v+=step){grid+=`<line x1="${L}" x2="${W-R}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)" stroke-width="1"/><text x="${L-6}" y="${y(v)+3}" text-anchor="end">${v}</text>`}
  const pts=w.map(p=>`${x(p.d).toFixed(1)},${y(p.w).toFixed(1)}`).join(" ");
  const area=`${L},${H-B} ${pts} ${x(w[w.length-1].d).toFixed(1)},${H-B}`;
  const last=w[w.length-1];
  return `<div class="chart"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Evolución del peso">
    ${grid}
    <line x1="${L}" x2="${W-R}" y1="${y(gw)}" y2="${y(gw)}" stroke="var(--accent)" stroke-dasharray="4 4" stroke-width="1.5"/>
    <text x="${W-R}" y="${y(gw)-5}" text-anchor="end" style="fill:var(--accent);font-weight:600">Objetivo ${String(gw).replace(".",",")}</text>
    <polygon points="${area}" fill="var(--accent)" opacity=".10"/>
    <polyline points="${pts}" fill="none" stroke="var(--accent)" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"/>
    <circle cx="${x(last.d)}" cy="${y(last.w)}" r="4.5" fill="var(--accent)" stroke="var(--surface)" stroke-width="2"/>
    <text x="${L}" y="${H-6}">${parse(w[0].d).getDate()} ${MON[parse(w[0].d).getMonth()]}</text>
    <text x="${W-R}" y="${H-6}" text-anchor="end">${parse(last.d).getDate()} ${MON[parse(last.d).getMonth()]}</text>
  </svg></div>`;
}
function adherence(){
  const t=todayISO(), tg=targets(); const days=[...Array(7)].map((_,i)=>addDays(t,i-6));

  const max=Math.max(tg.kcal*1.3,...days.map(d=>eatenOn(d).kcal));

  return `<div class="chart"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Calorías de los últimos 7 días">
   <line x1="10" x2="${W-10}" y1="${y(tg.kcal)}" y2="${y(tg.kcal)}" stroke="var(--muted)" stroke-dasharray="3 4"/>
   ${days.map((d,i)=>{const k=eatenOn(d).kcal;const hgt=Math.max(0,(H-B)-y(k));return `<rect x="${10+i*bw+bw*0.2}" y="${y(k)}" width="${bw*0.6}" height="${hgt}" rx="4" fill="${k>tg.kcal*1.08?"var(--warn)":"var(--accent)"}" opacity="${d===t?1:.75}"/><text x="${10+i*bw+bw/2}" y="${H-5}" text-anchor="middle">${DOW[parse(d).getDay()].slice(0,2)}</text>`}).join("")}
  </svg></div>`;
}

   <div class="field"><label for="sHour">Aviso la víspera</label><select class="input" id="sHour">${[18,19,20,21,22].map(h=>`<option value="${h}" ${s.remindHour==h?"selected":""}>${h}:00</option>`).join("")}</select></div></div>

/* ---------- Recordatorios (.ics para el Calendario del iPhone) ---------- */
function icsDate(d){return `${d.getUTCFullYear()}${pad(d.getUTCMonth()+1)}${pad(d.getUTCDate())}T${pad(d.getUTCHours())}${pad(d.getUTCMinutes())}00Z`}
function icsEsc(s){return String(s).replace(/\\/g,"\\\\").replace(/;/g,"\\;").replace(/,/g,"\\,").replace(/\n/g,"\\n")}
function buildICS(from,days){
  const out=["BEGIN:VCALENDAR","VERSION:2.0","PRODID:-//Despensa Fit//ES","CALSCALE:GREGORIAN","METHOD:PUBLISH"]; let n=0;
  for(let i=0;i<days;i++){
    const d=addDays(from,i), p=state.plan[d]||{};
    for(const [s,l,hh] of SLOTS){
      const r=p[s]&&recipe(p[s]); if(!r)continue;
      const [h,mi]=hh.split(":").map(Number); const start=parse(d);start.setHours(h,mi,0,0);
      const end=new Date(start.getTime()+Math.max(20,r.time)*60000);
      const prep=new Date(start.getTime()-r.time*60000-15*60000);
      const eve=parse(addDays(d,-1));eve.setHours(state.settings.remindHour,0,0,0);
      const miss=r.ing.filter(([id])=>!state.pantry.includes(id)).map(([id])=>ingName(id));
      const desc=`Ingredientes:\n${r.ing.map(([id,g])=>`- ${ingName(id)} ${qty(id,g)}`).join("\n")}${miss.length?`\n\nTe falta: ${miss.join(", ")}`:""}\n\nPasos:\n${r.steps.map((x,j)=>`${j+1}. ${x}`).join("\n")}`;
      out.push("BEGIN:VEVENT",`UID:${d}-${s}-${r.id}@despensafit`,`DTSTAMP:${icsDate(new Date())}`,`DTSTART:${icsDate(start)}`,`DTEND:${icsDate(end)}`,
        `SUMMARY:${icsEsc(`${l}: ${r.name}`)}`,`DESCRIPTION:${icsEsc(desc)}`,
        "BEGIN:VALARM","ACTION:DISPLAY",`DESCRIPTION:${icsEsc(`Mañana cocinas ${r.name}${miss.length?` (te falta ${miss.join(", ")})`:""}`)}`,`TRIGGER;VALUE=DATE-TIME:${icsDate(eve)}`,"END:VALARM",
        "BEGIN:VALARM","ACTION:DISPLAY",`DESCRIPTION:${icsEsc(`Empieza a preparar ${r.name}`)}`,`TRIGGER;VALUE=DATE-TIME:${icsDate(prep)}`,"END:VALARM",
        "END:VEVENT"); n++;
    }
  }
  out.push("END:VCALENDAR");
  return {text:out.map(foldLine).join("\r\n"),n};
}
function foldLine(l){if(l.length<=73)return l;let o=l.slice(0,73),r=l.slice(73);while(r.length){o+="\r\n "+r.slice(0,72);r=r.slice(72)}return o}
function exportICS(from,days){
  const {text,n}=buildICS(from,days);
  if(!n){toast("No hay comidas planificadas en esas fechas");return}
  if(window.claude&&window.claude.use){
    openSheet(`<div class="sheet-h"><div><div class="eyebrow">Recordatorios</div><h2>Calendario del iPhone</h2></div><button class="icon-btn" data-close aria-label="Cerrar">${ICON_X}</button></div>
    <div class="sheet-body"><p style="margin:0">Los avisos al Calendario funcionan en la versión instalada en tu pantalla de inicio. Desde aquí puedes ver las fechas de lo que tienes planificado:</p>
    <ul class="ilist">${[...Array(days)].map((_,i)=>addDays(from,i)).filter(d=>state.plan[d]).map(d=>`<li><span class="grow">${cap(fmtDay(d))}</span><span class="small muted">aviso la víspera a las ${state.settings.remindHour}:00</span></li>`).join("")}</ul></div>`);
    return;
  }
  const url="data:text/calendar;charset=utf-8,"+encodeURIComponent(text);
  const a=document.createElement("a");a.href=url;a.rel="noopener";document.body.appendChild(a);a.click();a.remove();
  toast(`${n} comida${n>1?"s":""} enviadas al Calendario`);
}

/* ---------- IA: inventar receta con la despensa (solo dentro de Claude) ---------- */
let sampleNS=null;
async function setupAI(){
  if(!window.claude||!window.claude.use)return;
  try{sampleNS=await claude.use("sample")}catch(e){sampleNS=null}
  if(tab==="cocinar")render();
}
function aiBoxHTML(){
  if(!sampleNS)return "";
  return `<div class="card" style="display:flex;flex-direction:column;gap:10px"><div class="eyebrow">Receta nueva con lo que tienes</div>
  <p class="small muted" style="margin:0">Claude inventa una receta usando tu despensa, tus macros pendientes de hoy y tu presupuesto.</p>
  <button class="btn" data-act="ai" id="aiBtn">Inventar receta</button><div id="aiOut" class="small muted"></div></div>`;
}
async function runAI(){
  const btn=$("#aiBtn"),out=$("#aiOut"); if(!sampleNS||!btn)return;
  btn.disabled=true; out.textContent="Pensando una receta…";
  const t=todayISO(),tg=targets(),e=eatenOn(t);
  const meal=ui.cookMeal==="todas"?"comida o cena":SLOTNAME[ui.cookMeal].toLowerCase();
  const pantryIds=state.pantry.join(", ")||"(vacía)";
  const ingKeys=Object.keys(ING).map(k=>`${k}=${ING[k][0]}`).join("; ");
  const prompt=`Eres un nutricionista y cocinero. Propón UNA receta fit de ${meal} para 1 ración, en español de España.
Ingredientes que tengo (ids): ${pantryIds}.
Catálogo de ids válidos: ${ingKeys}.
Usa sobre todo ingredientes que tengo; puedes añadir como máximo 2 del catálogo que no tengo. Sal, pimienta y especias no hace falta listarlas.
Macros que me quedan hoy: ${r0(tg.kcal-e.kcal)} kcal, ${r0(tg.p-e.p)} g proteína. Presupuesto restante esta semana: ${r0(state.settings.budget-weekSpend(t))} ${state.settings.currency}. Prioriza proteína alta.
No repitas estas recetas: ${allRecipes().map(r=>r.name).join("; ")}.
Responde SOLO con JSON: {"name":"...","meal":"desayuno|comida|snack|cena","time":20,"ing":[["id",gramos],...],"steps":["...","..."]}`;
  try{
    const j=await sampleNS.json(prompt,{modelTier:"default"});
    const ing=(j.ing||[]).filter(x=>Array.isArray(x)&&ING[x[0]]&&+x[1]>0).map(x=>[x[0],Math.round(+x[1])]);
    if(!j.name||ing.length<2||!Array.isArray(j.steps))throw {code:"bad"};
    const r={id:"ai"+Date.now(),name:String(j.name).slice(0,80),meal:["desayuno","comida","snack","cena"].includes(j.meal)?j.meal:"comida",time:Math.max(2,Math.min(120,+j.time||20)),ing,steps:j.steps.map(String).slice(0,10),ai:true};
    state.custom.push(r); save(); render(); recipeSheet(r.id); toast("Receta guardada en tu recetario");
  }catch(err){
    btn.disabled=false;
    out.textContent=err&&err.code==="not_granted"?"No se ha dado permiso para usar Claude en esta página.":err&&err.code==="rate_limited"?"Demasiadas peticiones seguidas. Prueba en un minuto.":"No ha salido una receta válida. Vuelve a intentarlo.";
  }
}

/* ---------- Autoplan ---------- */
function autoplan(){
  const ws=ui.weekStart,t=todayISO(); let n=0; const used={};
  for(let i=0;i<7;i++){const d=addDays(ws,i); if(d<t)continue; state.plan[d]=state.plan[d]||{};
    for(const [s] of SLOTS){ if(state.plan[d][s])continue;
      const opts=allRecipes().filter(r=>r.meal===s).map(r=>{const c=coverage(r);return {r,score:c.have/c.total-c.missCost*0.05-(used[r.id]||0)*0.6+Math.random()*0.15}}).sort((a,b)=>b.score-a.score);
      if(opts[0]){state.plan[d][s]=opts[0].r.id;used[opts[0].r.id]=(used[opts[0].r.id]||0)+1;n++}}}
  save();render();toast(n?`${n} huecos rellenados, priorizando lo que tienes`:"La semana ya está completa");
}

/* ---------- Copia de seguridad ---------- */
async function exportData(){
  const data=JSON.stringify(state,null,1), name=`despensa-fit-${todayISO()}.json`;
  if(window.claude&&window.claude.use){
    try{const dl=await claude.use("downloads"); if(dl){await dl.save({filename:name,data});toast("Copia guardada");return}}catch(e){if(e&&e.code==="declined")return}
  }
  try{const blob=new Blob([data],{type:"application/json"});const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();a.remove();toast("Copia guardada")}
  catch(e){toast("No se pudo exportar en este navegador")}
}
function importData(file){
  const fr=new FileReader();
  fr.onload=()=>{try{const s=normalize(JSON.parse(fr.result));if(!s.profile||!Array.isArray(s.weights))throw 0;state=s;save();closeSheet();render();toast("Datos importados")}catch(e){toast("Ese archivo no es una copia de Despensa Fit")}};
  fr.readAsText(file);
}

/* ---------- Eventos ---------- */
document.addEventListener("click",e=>{
  const close=e.target.closest("[data-close]"); if(close){closeSheet();return}
  const pick=e.target.closest("[data-pick]");
  if(pick){const {pick:id,day,slot}=pick.dataset;state.plan[day]=state.plan[day]||{};state.plan[day][slot]=id;save();closeSheet();render();toast(`${recipe(id).name} → ${fmtDay(day)}`);return}
  const tabBtn=e.target.closest(".tab"); if(tabBtn){tab=tabBtn.dataset.tab;try{localStorage.setItem(LS+".tab",tab)}catch(_){}render();window.scrollTo(0,0);if(tab==="cocinar")fillAI();return}
  const act=e.target.closest("[data-act]");
  const rc=e.target.closest("[data-recipe]");
  if(!act&&rc){sheetServ=1;recipeSheet(rc.dataset.recipe);return}
  if(!act)return;
  const a=act.dataset.act, ds=act.dataset, t=todayISO();
  switch(a){
    case "goto": tab=ds.tab; render(); window.scrollTo(0,0); break;
    case "eat": {state.eaten[t]=state.eaten[t]||{};state.eaten[t][ds.slot]=!state.eaten[t][ds.slot];save();render();break}
    case "pick": pickSheet(ds.day,ds.slot); break;
    case "unplan": delete state.plan[ds.day][ds.slot]; if(state.eaten[ds.day])delete state.eaten[ds.day][ds.slot]; save(); closeSheet(); render(); break;
    case "add-extra": extraSheet(); break;
    case "save-extra": {const name=$("#xName").value.trim(),k=+$("#xK").value;if(!name||!k){toast("Escribe qué has comido y sus kcal");return}
      (state.extras[t]=state.extras[t]||[]).push({name,kcal:k,p:+$("#xP").value||0,c:+$("#xC").value||0,f:+$("#xF").value||0});save();closeSheet();render();toast("Añadido a hoy");break}
    case "del-extra": state.extras[t].splice(+ds.i,1); save(); render(); break;
    case "pantry": {const i=state.pantry.indexOf(ds.id);i<0?state.pantry.push(ds.id):state.pantry.splice(i,1);save();const y=window.scrollY;render();fillAI();window.scrollTo(0,y);break}
    case "cook-meal": ui.cookMeal=ds.k; render(); fillAI(); break;
    case "rec-filter": ui.recFilter=ds.k; render(); break;
    case "add-spend": spendSheet(); break;
    case "save-spend": {const v=parseFloat(String($("#spA").value).replace(",","."));if(!(v>0)){toast("Escribe un importe");return}state.spend.push({d:t,a:Math.round(v*100)/100,n:$("#spN").value.trim()});save();spendSheet();render();toast("Compra anotada");break}
    case "del-spend": {const i=state.spend.findIndex(x=>x.d===ds.d&&x.a==ds.a);if(i>=0)state.spend.splice(i,1);save();spendSheet();render();break}
    case "serv": sheetServ=Math.max(1,Math.min(8,sheetServ+(+ds.n)));recipeSheet($("#sheetBody").dataset.rid);break;
    case "add-plan": {const d=$("#planDay").value,s=$("#planSlot").value;state.plan[d]=state.plan[d]||{};state.plan[d][s]=ds.id;save();closeSheet();render();toast(`Añadido: ${SLOTNAME[s]}, ${fmtDay(d)}`);break}
    case "eat-now": {const r=recipe(ds.id),m=macros(r,sheetServ);(state.extras[t]=state.extras[t]||[]).push({name:r.name+(sheetServ>1?` ×${sheetServ}`:""),kcal:r0(m.kcal),p:r0(m.p),c:r0(m.c),f:r0(m.f)});save();closeSheet();render();toast("Macros sumados a hoy");break}
    case "del-recipe": {state.custom=state.custom.filter(r=>r.id!==ds.id);for(const d in state.plan)for(const s in state.plan[d])if(state.plan[d][s]===ds.id)delete state.plan[d][s];save();closeSheet();render();toast("Receta borrada");break}
    case "week": ui.weekStart=addDays(ui.weekStart,+ds.n); render(); break;
    case "shopping": shoppingSheet(); break;
    case "bought": {const ids=[...document.querySelectorAll(".buy:checked")].map(x=>x.value);if(!ids.length){toast("Marca lo que has comprado");return}
      ids.forEach(id=>{if(!state.pantry.includes(id))state.pantry.push(id)});const v=parseFloat(String($("#buyAmount").value).replace(",","."));if(v>0)state.spend.push({d:t,a:Math.round(v*100)/100,n:"Lista de la compra"});save();shoppingSheet();render();toast(`${ids.length} producto${ids.length>1?"s":""} en tu despensa`);break}
    case "copy": {const txt=ds.text;navigator.clipboard?.writeText(txt).then(()=>toast("Lista copiada"),()=>toast("No se pudo copiar"));break}
    case "ics": exportICS(ds.from,Math.max(1,Math.round(+ds.days))); break;
    case "autoplan": autoplan(); break;
    case "add-weight": {const v=parseFloat(String($("#wInput").value).replace(",","."));if(!(v>=30&&v<=300)){toast("Escribe tu peso en kg");return}
      state.weights=state.weights.filter(x=>x.d!==t);state.weights.push({d:t,w:Math.round(v*10)/10});state.weights.sort((a,b)=>a.d<b.d?-1:1);save();render();toast("Peso guardado");break}
    case "weights": weightsSheet(); break;
    case "del-weight": state.weights=state.weights.filter(x=>x.d!==ds.d); save(); weightsSheet(); render(); break;
    case "settings": settingsSheet(); break;
    case "save-settings": {const p=state.profile;p.sex=$("#pSex").value;p.age=+$("#pAge").value||p.age;p.height=+$("#pHeight").value||p.height;
      const sw=+$("#pStart").value; if(sw){p.startWeight=sw; if(state.weights.length)state.weights[0].w=sw; else state.weights.push({d:t,w:sw});}
      p.goalWeight=+$("#pGoal").value||p.goalWeight;p.rate=+$("#pRate").value;p.activity=+$("#pAct").value;
      state.settings.budget=+$("#sBudget").value||0;state.settings.currency=$("#sCur").value;state.settings.remindHour=+$("#sHour").value;save();closeSheet();render();toast("Guardado");break}
    case "export": exportData(); break;
    case "reset-ask": $("#resetConfirm").innerHTML=`<div class="banner warn"><p>Se borrarán tu plan, pesos, compras y despensa.</p><button class="btn warn" data-act="reset">Sí, borrar todo</button></div>`; break;
    case "reset": {const keep=state.profile;state=emptyState();state.profile=keep;save();closeSheet();render();toast("Empiezas de cero");break}
    case "start-real": {const p=state.profile;state=emptyState();state.profile={...p};save();render();settingsSheet();break}
    case "ai": runAI(); break;
  }
});
document.addEventListener("input",e=>{
  if(e.target.id==="recSearch"){ui.recSearch=e.target.value;const pos=e.target.selectionStart;render();const el=$("#recSearch");el.focus();el.setSelectionRange(pos,pos)}
